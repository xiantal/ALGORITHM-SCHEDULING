<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SJF Scheduling Algorithm</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="algo-page">
    <nav class="navbar">
        <a href="nonpreemp.html" class="back-btn">← Back</a>
    </nav>
    <h1>Shortest Job First (SJF) Scheduling Algorithm</h1>
    
    <div class="input-section">
        <h2>Input Process Details</h2>
        <table id="input-table">
            <thead>
                <tr>
                    <th>Process</th>
                    <th>Arrival Time</th>
                    <th>Burst Time</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="input-body">
                <tr>
                    <td>P1</td>
                    <td><input type="number" class="arrival-time" min="" value=""></td>
                    <td><input type="number" class="burst-time" min="" value=""></td>
                    <td><button class="remove-btn remove-process">Remove</button></td>
                </tr>
            </tbody>
        </table>
        
        <div class="action-buttons">
            <button id="add-process">Add Process</button>
            <button id="calculate">Calculate</button>
            <button id="reset">Reset</button>
        </div>
    </div>
    
    <div class="result-section" id="result-section" style="display: none;">
        <h2>Results</h2>
        <table id="result-table">
            <thead>
                <tr>
                    <th>Process</th>
                    <th>Arrival Time</th>
                    <th>Burst Time</th>
                    <th>Completion Time</th>
                    <th>Turnaround Time</th>
                    <th>Waiting Time</th>
                </tr>
            </thead>
            <tbody id="result-body">
            </tbody>
        </table>
        
        <div style="margin-top: 20px;">
            <h3>Average Turnaround Time: <span id="avg-turnaround">0</span></h3>
            <h3>Average Waiting Time: <span id="avg-waiting">0</span></h3>
        </div>
        
        <h3>Gantt Chart</h3>
        <div class="gantt-chart" id="gantt-chart"></div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('add-process').addEventListener('click', function() {
                const tbody = document.getElementById('input-body');
                const rowCount = tbody.rows.length;
                const newRow = tbody.insertRow();
                
                newRow.innerHTML = `
                    <td>P${rowCount + 1}</td>
                    <td><input type="number" class="arrival-time" min="0" value="0"></td>
                    <td><input type="number" class="burst-time" min="0" value="0"></td>
                    <td><button class="remove-btn remove-process">Remove</button></td>
                `;
                
                newRow.querySelector('.remove-process').addEventListener('click', function() {
                    if (tbody.rows.length > 1) {
                        tbody.removeChild(newRow);
                        updateProcessNumbers();
                    } else {
                        alert("You need at least one process!");
                    }
                });
            });
            
            document.querySelectorAll('.remove-process').forEach(btn => {
                btn.addEventListener('click', function() {
                    const tbody = document.getElementById('input-body');
                    if (tbody.rows.length > 1) {
                        const row = this.closest('tr');
                        tbody.removeChild(row);
                        updateProcessNumbers();
                    } else {
                        alert("You need at least one process!");
                    }
                });
            });
            
            document.getElementById('reset').addEventListener('click', function() {
                const tbody = document.getElementById('input-body');
                tbody.innerHTML = `
                    <tr>
                        <td>P1</td>
                        <td><input type="number" class="arrival-time" min="0" value="0"></td>
                        <td><input type="number" class="burst-time" min="0" value="0"></td>
                        <td><button class="remove-btn remove-process">Remove</button></td>
                    </tr>
                `;
                
                document.querySelectorAll('.remove-process').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const tbody = document.getElementById('input-body');
                        if (tbody.rows.length > 1) {
                            const row = this.closest('tr');
                            tbody.removeChild(row);
                            updateProcessNumbers();
                        } else {
                            alert("You need at least one process!");
                        }
                    });
                });
                
                document.getElementById('result-section').style.display = 'none';
            });
            
            document.getElementById('calculate').addEventListener('click', function() {
                const processes = [];
                const rows = document.getElementById('input-body').rows;
                
                for (let i = 0; i < rows.length; i++) {
                    const arrival = parseInt(rows[i].querySelector('.arrival-time').value) || 0;
                    const burst = parseInt(rows[i].querySelector('.burst-time').value) || 0;
                    if (burst === 0) {
                        alert(`Process P${i+1} has burst time 0, which is not allowed.`);
                        return;
                    }
                    processes.push({
                        id: `P${i + 1}`,
                        arrival: arrival,
                        burst: burst,
                        remaining: burst,
                        completed: false
                    });
                }
                
                let currentTime = 0;
                let completedProcesses = 0;
                let totalTurnaround = 0;
                let totalWaiting = 0;
                const ganttSequence = [];
                
                while (completedProcesses < processes.length) {
                    const availableProcesses = processes.filter(p => 
                        p.arrival <= currentTime && !p.completed
                    );
                    
                    if (availableProcesses.length === 0) {
                        currentTime++;
                        continue;
                    }
                    
                    availableProcesses.sort((a, b) => a.remaining - b.remaining);
                    const currentProcess = availableProcesses[0];
                    
                    ganttSequence.push({
                        id: currentProcess.id,
                        start: currentTime,
                        end: currentTime + currentProcess.burst
                    });
                    
                    currentTime += currentProcess.burst;
                    currentProcess.completion = currentTime;
                    currentProcess.turnaround = currentProcess.completion - currentProcess.arrival;
                    currentProcess.waiting = currentProcess.turnaround - currentProcess.burst;
                    currentProcess.completed = true;
                    
                    totalTurnaround += currentProcess.turnaround;
                    totalWaiting += currentProcess.waiting;
                    completedProcesses++;
                }
                
                const resultBody = document.getElementById('result-body');
                resultBody.innerHTML = '';
                
                processes.forEach(process => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${process.id}</td>
                        <td>${process.arrival}</td>
                        <td>${process.burst}</td>
                        <td>${process.completion}</td>
                        <td>${process.turnaround}</td>
                        <td>${process.waiting}</td>
                    `;
                    resultBody.appendChild(row);
                });
                
                const avgTurnaround = totalTurnaround / processes.length;
                const avgWaiting = totalWaiting / processes.length;
                
                document.getElementById('avg-turnaround').textContent = avgTurnaround.toFixed(2);
                document.getElementById('avg-waiting').textContent = avgWaiting.toFixed(2);
                
                generateGanttChart(ganttSequence);
                
                document.getElementById('result-section').style.display = 'block';
            });
            
            function updateProcessNumbers() {
                const rows = document.getElementById('input-body').rows;
                for (let i = 0; i < rows.length; i++) {
                    rows[i].cells[0].textContent = `P${i + 1}`;
                }
            }
            
            function generateGanttChart(sequence) {
                const ganttChart = document.getElementById('gantt-chart');
                ganttChart.innerHTML = '';
                
                let previousEnd = 0;
                
                sequence.forEach(item => {
                    if (previousEnd < item.start) {
                        const idleBox = document.createElement('div');
                        idleBox.className = 'gantt-box';
                        idleBox.style.backgroundColor = '#ffcccc';
                        idleBox.textContent = 'Idle';
                        idleBox.style.minWidth = `${(item.start - previousEnd) * 30}px`;
                        ganttChart.appendChild(idleBox);
                        
                        const idleTimeMark = document.createElement('div');
                        idleTimeMark.className = 'time-mark';
                        idleTimeMark.textContent = previousEnd;
                        ganttChart.appendChild(idleTimeMark);
                        
                        previousEnd = item.start;
                    }
                    
                    const box = document.createElement('div');
                    box.className = 'gantt-box';
                    box.textContent = item.id;
                    box.style.minWidth = `${(item.end - item.start) * 30}px`;
                    ganttChart.appendChild(box);
                    
                    const timeMark = document.createElement('div');
                    timeMark.className = 'time-mark';
                    timeMark.textContent = item.start;
                    ganttChart.appendChild(timeMark);
                    
                    previousEnd = item.end;
                });
                
                const finalTimeMark = document.createElement('div');
                finalTimeMark.className = 'time-mark';
                finalTimeMark.textContent = previousEnd;
                ganttChart.appendChild(finalTimeMark);
            }
        });
    </script>
</body>
</html>
